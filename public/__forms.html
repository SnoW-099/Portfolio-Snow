<!DOCTYPE html>
<!-- Registers the contact form with Netlify Forms at deploy time. Field names must match components/ContactForm.tsx. -->
<html lang="en">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Contact form</title></head>
<body>
  <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact">
    <input name="bot-field">
    <input name="name">
    <input name="email" type="email">
    <select name="project-type"><option>Website</option></select>
    <select name="budget"><option>Not sure yet</option></select>
    <textarea name="message"></textarea>
  </form>
</body>
</html>
